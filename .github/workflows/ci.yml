name: Cardiovascular Disease ML API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify saved model
        run: |
          python -c "import joblib; model=joblib.load('models/model.joblib'); print('Model loaded successfully:', type(model))"

      - name: Run automated tests
        run: |
          python -m pytest -v

      - name: Build Docker image
        run: |
          docker build -t cardiovascular-api .